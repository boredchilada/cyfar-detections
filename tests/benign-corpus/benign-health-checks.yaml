name: "Health check and monitoring traffic"
requests:
  - name: "prometheus-metrics"
    method: GET
    uri: /metrics
    host: app.internal
    port: 9090
    client_ip: "10.0.5.10"
  - name: "kubernetes-healthz"
    method: GET
    uri: /healthz
    host: kube-apiserver.internal
    port: 6443
    client_ip: "10.0.5.10"
  - name: "generic-status-endpoint"
    method: GET
    uri: /api/v1/status
    host: service.internal
    port: 8080
    client_ip: "10.0.5.10"
    headers:
      Accept: application/json
