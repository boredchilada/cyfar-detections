name: "voidlink 1013: bootstrap fetch with a 54-character token-shape key (experimental)"

# The client defaults to a host inside HOME_NET. The server is an external documentation
# address. Keys are synthetic: the redacted shape from the report and a mixed-alphabet key.
rule: |-
  alert http $HOME_NET any -> any 3100 (msg:"C2 VoidLink bootstrap fetch, token-shape key (EXPERIMENTAL)";  flow:to_server,established;  http.method; content:"GET";  http.uri; content:"/api/bootstrap-install-script?key="; pcre:"/[?&]key=[A-Za-z0-9_-]{54}(?:&|$)/";  classtype:trojan-activity; sid:1000231013; rev:2;  metadata:created_at 2026-06-08, confidence Medium;)

tests:
  - name: "positive-54-char-key-redacted-shape"
    expected_sids: [1000231013]
    request:
      server_ip: 203.0.113.9
      method: GET
      uri: "/api/bootstrap-install-script?key=xxxxxxx_xxxxxxxxxxxxxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxxxx"
      host: 203.0.113.9
      port: 3100
      headers:
        User-Agent: curl/7.68.0

  - name: "positive-54-char-key-mixed-alphabet"
    expected_sids: [1000231013]
    request:
      server_ip: 203.0.113.9
      method: GET
      uri: "/api/bootstrap-install-script?key=q8Jx-4vTn2Lp_ZcR7mWdYb0sKfHgE3uA6iNoPtU1VaXjCrDeS9hBlM"
      host: 203.0.113.9
      port: 3100
      headers:
        User-Agent: curl/7.68.0

  - name: "positive-54-char-key-followed-by-parameter"
    expected_sids: [1000231013]
    request:
      server_ip: 203.0.113.9
      method: GET
      uri: "/api/bootstrap-install-script?key=q8Jx-4vTn2Lp_ZcR7mWdYb0sKfHgE3uA6iNoPtU1VaXjCrDeS9hBlM&arch=amd64"
      host: 203.0.113.9
      port: 3100
      headers:
        User-Agent: curl/7.68.0

  - name: "negative-53-char-key"
    expected_sids: []
    request:
      server_ip: 203.0.113.9
      method: GET
      uri: "/api/bootstrap-install-script?key=q8Jx-4vTn2Lp_ZcR7mWdYb0sKfHgE3uA6iNoPtU1VaXjCrDeS9hBl"
      host: 203.0.113.9
      port: 3100
      headers:
        User-Agent: curl/7.68.0

  - name: "negative-55-char-key"
    expected_sids: []
