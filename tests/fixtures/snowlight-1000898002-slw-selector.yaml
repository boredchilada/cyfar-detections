name: "MALWARE SNOWLIGHT /slw Architecture Selector Stage Request"

rule: >-
  alert http $HOME_NET any -> $EXTERNAL_NET any
  (msg:"MALWARE SNOWLIGHT /slw Architecture Selector Stage Request";
  flow:to_server,established;
  http.method; content:"GET";
  http.uri; content:"&t=ws&a="; fast_pattern;
  http.uri; content:"&stage=true";
  classtype:trojan-activity;
  sid:1000898002; rev:1;
  metadata:created_at 2026_10_21, deployment Egress;)

tests:
  - name: "positive-slw-l64-stage-request"
    expected_sids: [1000898002]
    request:
      client_ip: 10.0.0.25
      server_ip: 92.119.178.59
      port: 8080
      method: GET
      uri: "/?h=92.119.178.59&p=8988&t=ws&a=l64&stage=true"
      host: "92.119.178.59:8988"
      headers:
        User-Agent: "curl/8.5.0"

  - name: "positive-slw-a64-stage-request"
    expected_sids: [1000898002]
    request:
      client_ip: 10.0.0.25
      server_ip: 92.119.178.59
      port: 8080
      method: GET
      uri: "/?h=92.119.178.59&p=8988&t=ws&a=a64&stage=true"
      host: "92.119.178.59:8988"
      headers:
        User-Agent: "Wget/1.21.4"

  - name: "negative-benign-query-params"
    expected_sids: []
    request:
      client_ip: 10.0.0.25
      server_ip: 198.51.100.50
      port: 8080
      method: GET
      uri: "/api/v1/items?stage=true&a=l64"
      host: "api.example.com"
      headers:
        User-Agent: "curl/8.5.0"
