name: "voidlink 1001: Docker Engine API container create from external source"

# Source and destination addresses default to hosts inside HOME_NET. Tests that need an
# external client set client_ip.
rule: |-
  alert http $EXTERNAL_NET any -> $HOME_NET 2375 (msg:"ATTACK Inbound Docker Engine API container create from external source";  flow:to_server,established;  http.method; content:"POST";  http.uri; content:"/containers/create";  classtype:attempted-admin; priority:2; sid:1000231001; rev:2;  reference:url,docs.docker.com/engine/api/v1.47/;  metadata:created_at 2026-05-28;)

tests:
  - name: "positive-create-external"
    expected_sids: [1000231001]
    request:
      client_ip: 203.0.113.5
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
        User-Agent: Docker-Client/29.2.1 (linux)
      body: >-
        {"Image":"alpine","Cmd":["sh"],"HostConfig":{"Binds":["/:/host"]}}

  - name: "positive-unversioned-api-external"
    expected_sids: [1000231001]
    request:
      client_ip: 198.51.100.77
      method: POST
      uri: /containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine"}

  - name: "positive-versioned-api-external-query"
    expected_sids: [1000231001]
    request:
      client_ip: 192.0.2.44
      method: POST
      uri: "/v1.47/containers/create?name=test"
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"ubuntu"}

  - name: "negative-internal-source"
    expected_sids: []
    # No client_ip: the default client is inside HOME_NET, so $EXTERNAL_NET does not match.
    request:
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine"}

  - name: "negative-get-list"
    expected_sids: []
    request:
      client_ip: 203.0.113.5
      method: GET
      uri: /v1.47/containers/json
      host: 198.51.100.10
      port: 2375

  - name: "negative-wrong-port"
    expected_sids: []
    request:
      client_ip: 203.0.113.5
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 8080
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine"}

  - name: "negative-images-create-not-container-create"
    expected_sids: []
    request:
      client_ip: 203.0.113.5
      method: POST
      uri: "/v1.47/images/create?fromImage=alpine&tag=latest"
      host: 198.51.100.10
      port: 2375

  - name: "negative-get-method-on-create-path"
    expected_sids: []
    request:
      client_ip: 203.0.113.5
      method: GET
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
