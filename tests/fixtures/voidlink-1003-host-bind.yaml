name: "voidlink 1003: Docker create body binds host root filesystem"

# The rule matches any source. Addresses default to hosts inside HOME_NET; the external
# source test sets client_ip.
rule: |-
  alert http any any -> $HOME_NET 2375 (msg:"ATTACK Docker create body binds host root filesystem";  flow:to_server,established;  http.method; content:"POST";  http.uri; content:"/containers/create";  http.request_body; content:"\"Binds\""; content:"\"/:/"; distance:0; within:30;  classtype:attempted-admin; sid:1000231003; rev:2;  metadata:created_at 2026-05-28;)

tests:
  - name: "positive-bind-host"
    expected_sids: [1000231003]
    request:
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine","HostConfig":{"Binds":["/:/host"],"NetworkMode":"host"}}

  - name: "positive-bind-mnt"
    expected_sids: [1000231003]
    request:
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine","HostConfig":{"Binds":["/:/mnt"]}}

  - name: "positive-external-source"
    expected_sids: [1000231003]
    request:
      client_ip: 203.0.113.5
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine","HostConfig":{"Binds":["/:/host"]}}

  - name: "negative-benign-bind"
    expected_sids: []
    request:
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"postgres","HostConfig":{"Binds":["/var/lib/pgdata:/var/lib/postgresql/data"]}}
