name: "reverse-control-agent C2 DNS lookups and TLS SNI"

# Multi-rule fixture: 4 rules covering the C2 callback and R2 dropper
# fetch stages. All operate on DNS or TLS (not HTTP body), so they
# catch the encrypted stages that the inbound Docker API rules cannot.

rule: >-
  alert dns $HOME_NET any -> any 53 (msg:"MALWARE reverse-control-agent primary C2 DNS lookup (zhangge.okappx.ggff.net)";
  dns.query; content:"zhangge.okappx.ggff.net"; nocase; endswith;
  classtype:trojan-activity; sid:1000101010; rev:1;
  reference:url,pub-f49c78b9eb854878a5ee1d8e3c61aae8.r2.dev;
  metadata: created_at 2026-05-27;)

  alert dns $HOME_NET any -> any 53 (msg:"MALWARE reverse-control-agent backup C2 DNS lookup (zzz.ifconfig.dpdns.org)";
  dns.query; content:"zzz.ifconfig.dpdns.org"; nocase; endswith;
  classtype:trojan-activity; sid:1000101011; rev:1;
  metadata: created_at 2026-05-27;)

  alert tls $HOME_NET any -> any 443 (msg:"MALWARE reverse-control-agent C2 TLS handshake (zhangge.okappx.ggff.net)";
  tls.sni; content:"zhangge.okappx.ggff.net"; nocase; endswith;
  classtype:trojan-activity; sid:1000101012; rev:1;
  metadata: created_at 2026-05-27;)

  alert tls $HOME_NET any -> any 443 (msg:"MALWARE reverse-control-agent C2 TLS handshake (zzz.ifconfig.dpdns.org)";
  tls.sni; content:"zzz.ifconfig.dpdns.org"; nocase; endswith;
  classtype:trojan-activity; sid:1000101013; rev:1;
  metadata: created_at 2026-05-27;)

tests:
  - name: "positive-primary-dns"
    expected_sids: [1000101010]
    request:
      client_ip: 10.0.0.10
      server_ip: 203.0.113.53
      port: 53
      raw_hex: "0029123401000001000000000000077a68616e676765066f6b617070780467676666036e65740000010001"

  - name: "positive-backup-dns"
    expected_sids: [1000101011]
    request:
      client_ip: 10.0.0.10
      server_ip: 203.0.113.53
      port: 53
      raw_hex: "0028123401000001000000000000037a7a7a086966636f6e666967056470646e73036f72670000010001"

  - name: "positive-primary-tls-sni"
    expected_sids: [1000101012]
    request:
      client_ip: 10.0.0.10
      server_ip: 203.0.113.50
      port: 443
      raw_hex: "160301004f0100004b0303000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f0000021301010000200000001c001a0000177a68616e6767652e6f6b617070782e676766662e6e6574"

  - name: "positive-backup-tls-sni"
    expected_sids: [1000101013]
    request:
      client_ip: 10.0.0.10
      server_ip: 203.0.113.50
      port: 443
      raw_hex: "160301004e0100004a0303000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f00000213010100001f0000001b00190000167a7a7a2e6966636f6e6669672e6470646e732e6f7267"

  - name: "negative-unrelated-dns"
    expected_sids: []
    request:
      client_ip: 10.0.0.10
      server_ip: 203.0.113.53
      port: 53
      raw_hex: "001d123401000001000000000000076578616d706c6503636f6d0000010001"

  - name: "negative-unrelated-tls-sni"
    expected_sids: []
    request:
      client_ip: 10.0.0.10
      server_ip: 203.0.113.50
      port: 443
      raw_hex: "16030100430100003f0303000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f00000213010100001400000010000e00000b6578616d706c652e636f6d"
