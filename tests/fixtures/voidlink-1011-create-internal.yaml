name: "voidlink 1011: Docker Engine API container create from internal source"

# Source and destination addresses default to hosts inside HOME_NET, which is the internal
# case. Tests that need an external client set client_ip.
rule: |-
  alert http $HOME_NET any -> $HOME_NET 2375 (msg:"POLICY Inbound Docker Engine API container create from internal source";  flow:to_server,established;  http.method; content:"POST";  http.uri; content:"/containers/create";  classtype:policy-violation; priority:4; sid:1000231011; rev:1;  reference:url,docs.docker.com/engine/api/v1.47/;  metadata:created_at 2026-05-28;)

tests:
  - name: "positive-create-internal"
    expected_sids: [1000231011]
    request:
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
        User-Agent: Docker-Client/29.2.1 (linux)
      body: >-
        {"Image":"alpine","Cmd":["sh"]}

  - name: "negative-external-source"
    expected_sids: []
    request:
      client_ip: 203.0.113.5
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine"}

  - name: "negative-get-list"
    expected_sids: []
    request:
      method: GET
      uri: /v1.47/containers/json
      host: 198.51.100.10
      port: 2375

  - name: "negative-images-create-not-container-create"
    expected_sids: []
    request:
      method: POST
      uri: "/v1.47/images/create?fromImage=alpine&tag=latest"
      host: 198.51.100.10
      port: 2375

  - name: "negative-outbound-to-external-daemon"
    expected_sids: []
    # The destination is outside HOME_NET, so the rule for inbound traffic does not match.
    request:
      server_ip: 203.0.113.9
      method: POST
      uri: /v1.47/containers/create
      host: 203.0.113.9
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine"}
