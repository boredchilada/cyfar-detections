services:
  validator:
    build: .
    volumes:
      - ./fixtures:/validator/fixtures:ro
      - ./output:/validator/output
  benign-check:
    build: .
    entrypoint: ["python3", "benign_check.py"]
    volumes:
      - ./benign-corpus:/validator/benign-corpus:ro
      - ./suricata:/validator/suricata:ro
