name: "Outbound TLS from server subnet to dynamic-DNS zones (C2 callback behavior)"

# Behavioral rule: servers don't resolve or connect to dyndns hostnames.
# A TLS handshake from a server subnet to a dyndns parent zone is a
# strong C2 indicator regardless of the specific hostname or actor.
#
# The zone list covers providers disproportionately used for C2
# infrastructure. Ordered by abuse prevalence from public reporting.
# Scope $HOME_NET to server/container subnets only — if workstations
# are included, this will fire on users visiting dyndns-hosted sites.

rule: >-
  alert tls $HOME_NET any -> !$HOME_NET 443 (msg:"ET POLICY Outbound TLS from server to dynamic-DNS zone";
  flow:to_server,established;
  tls.sni; pcre:"/\.(ddns\.net|duckdns\.org|no-ip\.(org|com|biz)|dynu\.com|hopto\.org|zapto\.org|sytes\.net|serveftp\.com|dyndns\.org|freedns\.afraid\.org|ggff\.net|dpdns\.org|chickenkiller\.com|gotdns\.ch|myftp\.biz|myvnc\.com|publicvm\.com)$/i";
  classtype:policy-violation; sid:1000101030; rev:1;
  metadata: created_at 2026-05-28;)

tests:
