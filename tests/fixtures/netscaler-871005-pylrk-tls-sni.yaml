name: "NetScaler 871005 - pylrk.cc TLS SNI from the appliance network (CVE-2026-88771, high)"

rule: >-
  alert tls $HOME_NET any -> $EXTERNAL_NET any (msg:"CITRIX NETSCALER Delivery and C2 Domain pylrk.cc TLS SNI (CVE-2026-88771)";
  flow:to_server,established;
  tls.sni; dotprefix; content:".pylrk.cc"; nocase; endswith;
  reference:cve,2026-88771;
  classtype:trojan-activity; priority:2; sid:1000871005; rev:1;)

tests:
  - name: "positive-c2-host-www"
    expected_sids: [1000871005]
