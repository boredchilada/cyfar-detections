name: "TDGate 1000876002 - direct-mode fake TLS SNI"

rule: >-
  alert tls $HOME_NET any -> any any (msg:"MALWARE-CNC TDGate direct-mode fake TLS SNI";
  flow:to_server,established;
  tls.sni; content:"td-"; startswith; nocase; content:".local"; distance:0; nocase; endswith; fast_pattern;
  pcre:"/^td-(gate|tun)\.local$/i";
  classtype:trojan-activity; priority:1; sid:1000876002; rev:3;)

tests:
  - name: "positive-td-gate-local-port-443"
    expected_sids: [1000876002]
    request:
      client_ip: 10.0.0.10
      server_ip: 203.0.113.50
      port: 443
      raw_hex: "16030100450100004103030102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f2000000213010100001600000012001000000d74642d676174652e6c6f63616c"

