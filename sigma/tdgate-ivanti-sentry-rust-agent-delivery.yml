title: TDGate Delivery or Temporary-Path Launch
id: 9b4e2f1a-7c8d-4e3b-9a1f-6d5c4b3a2e10
status: experimental
description: Detects the observed TDGate delivery path or execution from temporary locations with its sandbox-skip switches.
author: Cyfar
date: 2026-11-02
logsource:
  product: linux
  category: process_creation
detection:
  selection_delivery:
    CommandLine|contains|all:
      - 'TD_PROJ='
      - 'Q1fc8a9OCb7AsC6f/dl/'
  selection_domain_or_base64:
    CommandLine|contains:
      - 'cdn.876553.xyz'
      - 'VT1odHRwczovL2Nkbi44NzY1NTMueHl6'
  selection_temp_ia:
    Image|endswith: '/.ia'
    CommandLine|contains:
      - '--bypass'
      - '--nosb'
  selection_temp_cache:
    Image|contains:
      - '/tmp/.cache_'
      - '/var/tmp/.cache_'
      - '/dev/shm/.cache_'
    CommandLine|contains:
      - '--bypass'
      - '--nosb'
  condition: selection_delivery or selection_domain_or_base64 or selection_temp_ia or selection_temp_cache
falsepositives:
  - Threat-research, incident-response, or purple-team commands using the exact TDGate indicators
level: high
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
