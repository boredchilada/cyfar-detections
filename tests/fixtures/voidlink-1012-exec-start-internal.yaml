name: "voidlink 1012: Docker Engine API exec/start from internal source"

# Source and destination addresses default to hosts inside HOME_NET, which is the internal
# case. Tests that need an external client set client_ip.
rule: |-
  alert http $HOME_NET any -> $HOME_NET 2375 (msg:"POLICY Inbound Docker Engine API exec/start from internal source";  flow:to_server,established;  http.method; content:"POST";  http.uri; content:"/exec/"; content:"/start"; distance:0;  classtype:policy-violation; priority:4; sid:1000231012; rev:1;  metadata:created_at 2026-05-28;)

tests:
  - name: "positive-exec-start-internal"
    expected_sids: [1000231012]
    request:
      method: POST
      uri: /v1.47/exec/e8b3f7b41e0b4b1fa41e3c6d7c0f9a24/start
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Detach":false,"Tty":false}

  - name: "negative-external-source"
    expected_sids: []
    request:
      client_ip: 203.0.113.5
      method: POST
      uri: /v1.47/exec/e8b3f7b41e0b4b1fa41e3c6d7c0f9a24/start
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Detach":false,"Tty":false}

  - name: "negative-create-not-exec"
    expected_sids: []
    request:
      method: POST
      uri: /v1.47/containers/create
      host: 198.51.100.10
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Image":"alpine"}

  - name: "negative-container-start-not-exec-start"
    expected_sids: []
    request:
      method: POST
      uri: /v1.47/containers/abcdef0123/start
      host: 198.51.100.10
      port: 2375

  - name: "negative-exec-resize-not-start"
    expected_sids: []
    request:
      method: POST
      uri: "/v1.47/exec/e8b3f7b41e0b4b1fa41e3c6d7c0f9a24/resize?h=40&w=120"
      host: 198.51.100.10
      port: 2375

  - name: "negative-outbound-to-external-daemon"
    expected_sids: []
    # The destination is outside HOME_NET, so the rule for inbound traffic does not match.
    request:
      server_ip: 203.0.113.9
      method: POST
      uri: /v1.47/exec/e8b3f7b41e0b4b1fa41e3c6d7c0f9a24/start
      host: 203.0.113.9
      port: 2375
      headers:
        Content-Type: application/json
      body: >-
        {"Detach":false,"Tty":false}
