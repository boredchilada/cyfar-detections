name: "MALWARE SafeNetv2 React Server Components Node.js Dropper (CVE-2025-55182)"

rule: >-
  alert http $EXTERNAL_NET any -> $HOME_NET any
  (msg:"MALWARE SafeNetv2 React Server Components Node.js Dropper (CVE-2025-55182)";
  flow:to_server,established;
  http.method; content:"POST";
  http.request_body;
  content:"__proto__:then";
  content:"/tmp/safenet-client"; fast_pattern; distance:0;
  content:"/.safenet-client.pid"; distance:0;
  reference:cve,2025-55182;
  classtype:trojan-activity;
  sid:1000209002; rev:1;
  metadata:created_at 2026_10_19, deployment Ingress;)

tests:
  - name: "positive-captured-safenet-nodejs-dropper"
    expected_sids: [1000209002]
    request:
      client_ip: 198.51.100.21
      method: POST
      uri: /
      host: target.example.com
      headers:
        User-Agent: Mozilla/5.0
        Next-Action: x
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW
      body: "------WebKitFormBoundary7MA4YWxkTrZu0gW\r\nContent-Disposition: form-data; name=\"0\"\r\n\r\n{\"then\":\"$1:__proto__:then\",\"status\":\"resolved_model\",\"reason\":-1,\"value\":\"{\\\"then\\\":\\\"$B1337\\\"}\",\"_response\":{\"_prefix\":\"var res=(function(){const filePath = '/tmp/safenet-client';\\nconst pidFile = '/tmp/.safenet-client.pid';\\n// PIDFILE DEDUP: if a live client already wrote its pid, skip the})();\",\"_chunks\":\"$Q2\",\"_formData\":{\"get\":\"$1:constructor:constructor\"}}}\r\n------WebKitFormBoundary7MA4YWxkTrZu0gW\r\nContent-Disposition: form-data; name=\"1\"\r\n\r\n\"$@0\"\r\n------WebKitFormBoundary7MA4YWxkTrZu0gW--\r\n"

  - name: "negative-path-mention-without-rsc-gadget"
    expected_sids: []
    request:
      client_ip: 198.51.100.21
      method: POST
      uri: /api/notes
      host: target.example.com
      headers:
        Content-Type: application/json
      body: >-
        {"note":"Check /tmp/safenet-client and /tmp/.safenet-client.pid on Linux hosts"}

  - name: "negative-rsc-oracle-only"
    expected_sids: []
    request:
      client_ip: 198.51.100.21
      method: POST
      uri: /
      host: target.example.com
      headers:
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW
      body: "------WebKitFormBoundary7MA4YWxkTrZu0gW\r\nContent-Disposition: form-data; name=\"0\"\r\n\r\n{\"then\":\"$1:__proto__:then\",\"_response\":{\"_prefix\":\"return 'vUlN_cHeCk_sUcCeSs_69420';\"}}\r\n------WebKitFormBoundary7MA4YWxkTrZu0gW--\r\n"
